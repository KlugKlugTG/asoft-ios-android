name: build-and-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shell-check:
    name: Setup scripts parse (bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every .sh file passes bash -n
        run: |
          set -e
          scripts=$(git ls-files '*.sh' | sort)
          test -n "$scripts"
          n=0
          for f in $scripts; do
            bash -n "$f"
            n=$((n + 1))
          done
          echo "bash -n OK on $n scripts"

  release-apk:
    # A signed, installable release APK of this fork. QEMU, Turnip and the setup assets are not in
    # the repository (pull-libs*.sh builds them on a PC), so they are taken from the author's own
    # release APK and this fork's code is built around them. Uninstall the installed app before
    # installing this one: it is signed with a different key.
    name: Build the signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the Android SDK pieces the build needs
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSfL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13846066" "cmake;3.22.1"
      - name: The repo's gradle.properties names the author's Windows JDK; drop it for the runner
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties
      - name: The native libraries and the assets, from the author's release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/official
          gh release download --repo alpersamur3/asoft-ios-android --pattern '*.apk' --dir /tmp/official --clobber
          apk=$(ls -S /tmp/official/*.apk | head -1)
          echo "official APK: $apk ($(du -h "$apk" | cut -f1))"
          unzip -q "$apk" 'lib/arm64-v8a/*' 'assets/*' -d /tmp/official-x
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          cp /tmp/official-x/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          cp -r /tmp/official-x/assets/. app/src/main/assets/
          echo "libraries: $(ls app/src/main/jniLibs/arm64-v8a | wc -l), assets: $(find app/src/main/assets -type f | wc -l)"
      - name: The fork's own setup scripts over the harvested ones
        run: |
          set -e
          # the phone's jobs and prelude (this repository): the 8-vCPU device trees are built by the
          # patched shared-build.sh
          mkdir -p app/src/main/assets/setup/phone/jobs
          cp setup/phone/*.sh setup/phone/*.py app/src/main/assets/setup/phone/
          cp setup/phone/jobs/*.sh app/src/main/assets/setup/phone/jobs/
          grep -c 'dtree-root26smp.py fw/dtree.orig dtree-smp8' app/src/main/assets/setup/phone/jobs/shared-build.sh
          # the companion fork's patched iOS 26 build steps (plain text assets)
          git clone --depth 1 https://github.com/KlugKlugTG/asoft-ios /tmp/asoft-ios
          for f in mk-root26.sh m2-finish.sh; do
            cp "/tmp/asoft-ios/ios26/scripts/$f" "app/src/main/assets/setup/scripts/ios26/$f"
          done
          sha256sum app/src/main/assets/setup/scripts/ios26/mk-root26.sh
      - name: A release key for this build
        run: |
          set -e
          keytool -genkeypair -keystore "$RUNNER_TEMP/asoft.jks" -storepass asoftasoft -keypass asoftasoft \
            -alias asoft -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ASoftware fork (KlugKlugTG)"
          printf 'storeFile=%s\nstorePassword=asoftasoft\nkeyAlias=asoft\nkeyPassword=asoftasoft\n' \
            "$RUNNER_TEMP/asoft.jks" > "$RUNNER_TEMP/asoft-release.properties"
          echo "ASOFT_SIGNING=$RUNNER_TEMP/asoft-release.properties" >> "$GITHUB_ENV"
      - name: Build
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: The APK
        run: |
          set -e
          ls -l app/build/outputs/apk/release/
          cd app/build/outputs/apk/release
          sha256sum *.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: asoft-ios-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
