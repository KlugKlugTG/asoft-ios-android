plugins {
    id 'com.android.application'
}

android {
    namespace 'com.asoft.ios'
    compileSdk 36
    ndkVersion '29.0.13846066'
    defaultConfig {
        applicationId 'com.asoft.ios'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // libqemu.so is an executable and lib_*.so its libraries: they must be real files in
    // nativeLibraryDir, the one place an app may exec from, and stay as they were built.
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
        }
    }
}
